name: Release

# Pushing a tag like v0.2.0 publishes the GitHub release that HACS offers as an update.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the tag matches the manifest version
        run: |
          version=$(jq -r .version custom_components/lan_power_manager/manifest.json)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${version}"
            exit 1
          fi

      - name: Zip the integration
        run: |
          cd custom_components/lan_power_manager
          zip -r "${GITHUB_WORKSPACE}/lan_power_manager.zip" . -x "__pycache__/*"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: lan_power_manager.zip
          generate_release_notes: true
